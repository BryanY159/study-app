# CI for every push to main and every pull request; deploy to GitHub Pages
# only from a version tag (v*). The site holds no content pack: packs are
# imported on each device through the app's Import.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Leak guard (tracked files)
        run: npm run leak-guard
      - run: npm run typecheck
      - run: npm test
      - name: Install Playwright browsers (Chromium + WebKit for the phone and tablet projects)
        run: npx playwright install --with-deps chromium webkit
      - name: End-to-end tests (builds first)
        run: npm run e2e
      - name: Leak guard (tracked files + built output)
        run: npm run leak-guard -- --dist
      - name: Upload site
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
